# Example search config. Copy to config.yaml (gitignored) and edit for your own search.
# Principle: cut only the clearly unsuitable, rank the rest by priority.

search:
  period_days: 30            # lookback window for the first scan
  per_page: 100
  queries:
    # field: name = search in the vacancy title, field: all = full text
    - { text: "Backend developer",  field: name }
    - { text: "Python разработчик", field: name }
    - { text: "Python",             field: all }

# hh work formats the candidate accepts (REMOTE | HYBRID | ON_SITE); a vacancy must offer at least one.
# Office posts from Habr, GetMatch and Telegram are dropped unless ON_SITE is listed (hybrid ones unless HYBRID is listed).
work_formats: [REMOTE]

# Prompt texts for the LLM (screening, letters, answers): a file from prompts/ that matches your field.
prompts: prompts/example.yaml
# Hours on contact in Moscow time; replaces {availability} in the prompts.
availability_msk: "07:00 до 16:00"
# Where the candidate is, as it should read after "кандидат" in letters ("в Новосибирске (UTC+7)"); empty = not mentioned.
location_note: ""
# Labels for the stack value of the screening prompt and for the form_answers keys on the card (a key without a label is shown as is).
stack_labels: {}
form_labels: {}
# Habr Career and GetMatch: searches, what makes a vacancy relevant, what to skip. Empty = nothing is found there.
habr_queries: ["Python"]
secondary_terms: ["python"]
secondary_exclude_titles: ["qa", "тестир", "analyst", "аналитик", "менеджер", "manager"]
secondary_exclude_if_no_term: []

salary:
  filter: false                      # true would hide low salaries; by default salary only sets priority
  normal_priority_from_rub: 100000   # net; lower or missing -> low priority

seniority:
  # Titles containing these are skipped, unless they also contain an "ok" marker
  skip: ["senior", "lead", "head of", "principal", "staff", "тимлид", "ведущий"]
  ok_markers: ["middle", "junior", "джун", "trainee", "стажер"]

# A title containing any of these is relevant right away
title_signals: ["python"]

# For titles without a signal: kept only if the full description contains one of these
description_signals: ["python", "django", "fastapi"]

stop_roles_keywords:
  # Skipped when present in a title that has no title signal
  - qa
  - тестировщик
  - аналитик
  - дизайнер
  - менеджер

stop_text_keywords:
  # Skipped when found in the title or description
  - только вёрстка
  - pixel perfect

low_priority_keywords:
  # Kept, but with low priority
  - стажер
  - intern
  - подработка
  - частичная занятость

limits:
  daily_llm_budget_usd: 0.25         # stop LLM calls and alert when the last 24 hours cost this much
  max_applies_per_day: 30
  mode: draft_only                   # draft_only | auto

# Basic answers copied under vacancies whose response has a questionnaire.
# Phone and Telegram come from .env (APPLY_PHONE, APPLY_TELEGRAM).
# Public Telegram job channels to watch (names without @); empty or missing = none.
# Gender of the candidate: male | female. Sets the verb forms in the bot's button and in the drafts (откликнулся / откликнулась).
candidate_gender: male

telegram_channels:
  # - some_job_channel   # public channel name, without @

# Direct outreach ("hidden market"): the bot finds studios, outsourcing firms and agencies by itself and drafts a first
# message for each; you send it by hand. Off by default. Switch in the chat: /hidden on | off. Nothing here is tied to a stack.
outreach:
  enabled: false
  profile_terms: ["python", "backend"]   # what you do; search queries, channel filtering and relevance checks use these words
  exclude_terms: []                      # directions you do not consider, e.g. ["PHP", "1C"]: a company that does only these is skipped
  # search_queries use {term} for each profile term (defaults are in jobbot/outreach/conf.py):
  # search_queries: ["студия разработки {term}", "{term} development studio outsourcing"]
  seed_sources: []                       # optional starting pages (catalogs, ratings): [{name: "...", url: "https://..."}]
  habr_queries: []                       # optional Habr Career searches whose employers become targets, e.g. ["Python"]
  max_new_per_day: 3                     # new cards per day
  follow_up_days: 7                      # one reminder this many days after you press "Написал"
  discovery:
    providers: [yandex, serper, ddg]     # one without a key in .env is skipped
    combine: true                        # ask every provider with a key and merge the results (a wider pool); false: first working one
    max_queries_per_day: 30              # Yandex bills per request; each query returns up to 20 pages

form_answers:
  salary: "100 000 RUB"
  city: "Your city"
  mobile_experience: "Android: N years, iOS: none"
  web_experience: "No commercial experience with Flutter Web"

# Job sources to search. Set false to switch one off (hh is the main search; missing means on).
sources:
  hh: true
  habr: true
  getmatch: true
  trudvsem: true
  telegram: true
